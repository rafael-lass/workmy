# WorkMy — Docker Compose (ambiente de desenvolvimento + staging)
# Uso: docker compose up -d
# Logs: docker compose logs -f
#
# Serviços:
#   postgres   — banco de dados relacional (PostgreSQL 15)
#   fastapi    — backend core (FastAPI + SQLAlchemy Async)
#   bff        — proxy gateway Node.js (HTTP-Only cookies + JWT injection)
#   frontend   — build React servido pelo Nginx

# ─── Rede interna ────────────────────────────────────────────────────────────
networks:
  workmy_net:
    driver: bridge

# ─── Volumes persistentes ─────────────────────────────────────────────────────
volumes:
  postgres_data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Banco de dados relacional
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-workmy_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-workmy_password}"
      POSTGRES_DB: "${POSTGRES_DB:-workmy_db}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workmy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Backend FastAPI
  # ──────────────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    environment:
      # Banco
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-workmy_user}:${POSTGRES_PASSWORD:-workmy_password}@postgres:5432/${POSTGRES_DB:-workmy_db}"
      # JWT — OBRIGATÓRIO em produção. Gere com: python -c "import secrets; print(secrets.token_urlsafe(64))"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev_secret_change_me_in_production}"
      # CORS — origens do BFF e do frontend (separados por vírgula)
      CORS_ORIGINS: "http://localhost:3000,http://bff:3000"
      # Logging — 'json' em produção, 'text' em desenvolvimento
      LOG_FORMAT: "${LOG_FORMAT:-text}"
    networks:
      - workmy_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 3. BFF — Backend For Frontend (Node.js proxy gateway)
  # ──────────────────────────────────────────────────────────────────────────
  bff:
    build:
      context: ./frontend/bff
      dockerfile: Dockerfile
    environment:
      # URL do FastAPI (nome do serviço Docker, não localhost)
      FASTAPI_URL: "http://fastapi:8000"
      # CORS — origem do frontend React (Vite dev server ou domínio de produção)
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      PORT: "3000"
      NODE_ENV: "${NODE_ENV:-development}"
    networks:
      - workmy_net
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Frontend React (build estático servido por Nginx)
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - workmy_net
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
