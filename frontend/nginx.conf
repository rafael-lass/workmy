server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Arquivos de até 5 MiB crescem cerca de 33% quando enviados em Base64.
        # Mantém o proxy alinhado ao limite de 8 MiB configurado no BFF.
        client_max_body_size 8m;

        proxy_pass http://bff:3000;
        # Relatórios grandes são gerados sequencialmente antes do download.
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
