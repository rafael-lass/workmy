name: Backup criptografado
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workmy-production
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dump and encrypt (no plaintext artifact)
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python deploy/backup.py
      - uses: actions/upload-artifact@v4
        with:
          name: workmy-database-encrypted-${{ github.run_id }}
          path: ${{ steps.dump.outputs.backup_file }}
          if-no-files-found: error
          retention-days: 7
      - name: Recovery reminder
        run: echo 'Baixe o artifact e conserve a senha fora do GitHub. O arquivo contém somente o schema public do WorkMy, sem os schemas gerenciados pelo Supabase.' >> "$GITHUB_STEP_SUMMARY"
