name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Validate database baseline
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./ci.sqlite3 uv run --frozen alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./ci.sqlite3 uv run --frozen alembic check
      - run: uv run --frozen pytest -q

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/bff/package-lock.json
      - run: npm ci --omit=dev
      - run: node --check server.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  images:
    needs: [backend, bff, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test full stack and compiled CSS
        run: |
          docker compose up -d
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:5173/login -o /tmp/login.html
          grep -q '<div id="root"></div>' /tmp/login.html
          docker compose exec -T frontend nginx -T 2>&1 | grep -q 'client_max_body_size 8m;'
          css_path=$(grep -oE '/assets/[^" ]+\.css' /tmp/login.html | head -n 1)
          test -n "$css_path"
          curl -fsSI "http://localhost:5173${css_path}" | grep -qi '^content-type: text/css'
          curl -fsS http://localhost:5173/dashboard | grep -q '<div id="root"></div>'
      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
