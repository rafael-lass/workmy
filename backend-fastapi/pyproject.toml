[project]
name = "workmy-backend"
version = "2.0.0"
description = "API assíncrona do WorkMy"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pydantic[email]>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.0.0",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.40.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
